name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: bash -n scripts/*.sh tests/*.sh

      - name: Run converter tests
        run: bash tests/convert-obsidian-images.test.sh
